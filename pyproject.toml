[project]
name = "pbix-atlas"
version = "0.2.0"
description = "Universal lineage graph for Power BI (.pbix) files, from physical source to report display."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "fabienfrfr", email = "fabien.furfaro@gmail.com" },
]
keywords = ["power-bi", "pbix", "data-lineage", "dax", "power-query", "networkx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pbixray>=0.15",
    "networkx>=3.0",
    "pandas>=2.0",
    "pygraphviz>=2.0.1",
    "matplotlib>=3.10.9",
    "scipy>=1.15.3",
    "pathspec>=1.1.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "fastmcp>=2.0,<4",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
]
codegen = [
    "vizro>=0.2.03",
    "plotly>=5.20",
    "sqlalchemy>=2.0",
    "requests>=2.31",
]
dev = [
    "pytest>=8.0",
    "pytest-bdd>=7.0",
    "marimo>=0.23",
    "pyvis>=0.3.2",
    "pbix-atlas[api]",
    "pbix-atlas[codegen]",
    "httpx>=0.27",
]

[project.scripts]
pbix-atlas = "pbix_atlas.api.app:main"
pbix-atlas-codegen = "pbix_atlas.cli:main"

[project.urls]
Homepage = "https://github.com/fabienfrfr/pbix-atlas"
Issues = "https://github.com/fabienfrfr/pbix-atlas/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbix_atlas"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF", "BLE", "PLR", "SIM"]
ignore = ["BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["pbix_atlas"]

[tool.ruff.lint.per-file-ignores]
"src/pbix_atlas/codegen.py" = ["E501"]
"tests/*" = ["PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
